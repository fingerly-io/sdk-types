# CI only. @fingerly/types is published from the sdks repository.
name: Types
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Build first: tests/package.test.ts checks the files the exports name.
      - run: pnpm build
      - run: pnpm test
      # `pnpm lint` also type-checks tests/, which needs @types/node. That only
      # comes from the sdks workspace, where lint runs before every release.
